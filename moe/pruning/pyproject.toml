[project]
name = "mrd-pruning"
version = "1.0.0"
description = "Routing maps, load statistics and frequency pruning of MoE experts under adaptation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
run = [
    "torch>=2.4",
    "transformers>=4.55,<5",
    "peft>=0.13",
    "accelerate>=0.34",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrd_pruning"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-m 'not artifacts'"
markers = [
    "artifacts: checks finished runs under results/ and routing_maps_final/; run with `pytest -m artifacts`",
]
