  dataset_ids:
    [
      civil_comments,
      goemotions,
      hallmarks_of_cancer,
    ]
  conditions:
    - C_null
    - C_bland
    - C_seed
    - C_adapt
    - C_prefix
    - C_seed_pad
    - C_prefix_rand
    - C_adapt_shuf0
    - C_adapt_shuf1
    - C_adapt_shuf2
    - C_adapt_rand
task_provider:
  kind: vllm
  model: google/gemma-2-9b-it
  temperature: 0.0
  base_url: http://127.0.0.1:8010/v1
generation:
  temperature: 0.0
  max_new_tokens: 128
  do_sample: false
gepa:
  seeds: [42, 43, 44]
  max_metric_calls: 10000
  pilot_metric_calls: 1000
  reflection_minibatch_size: 5
  reflection_max_tokens: 32768
  reflection_instruction_budget_tokens: 8192
  local_reflector:
    kind: vllm
    model: lordx64/Qwen3.6-35B-A3B-Claude-4.7-Opus-Reasoning-Distilled
    temperature: 0.7
    revision: 9461222ba22e5ec299004c1bef5d932cdee26152
    dtype: bfloat16
    quantization: null
    chat_template_kwargs:
      enable_thinking: false
    base_url: http://127.0.0.1:8020/v1
  api_reflector:
    kind: openai
    # Dated model id.
    model: openai/gpt-5.6-luna-pro-20260709
    temperature: 0.7
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # Reasoning tokens count against reflection_max_tokens.
    extra_body:
      reasoning:
        effort: medium
    timeout_seconds: 900.0
    max_retries: 8
prefix:
  seeds: [42, 43, 44]
  virtual_tokens: [10, length_match]
  learning_rates: [0.001, 0.0003, 0.0001]
  max_steps: 500
  pilot_steps: 300
  patience: 50
  batch_size: 4
  validation_interval: 10
  checkpoint_fractions: [0.1, 0.25, 0.5]
probes:
  c_values: [0.01, 0.1, 1.0, 10.0]
  seeds: [0, 1, 2, 3, 4]
  threshold: 0.5
interventions:
  alphas: [0.5, 1.0, 2.0, 4.0]
  relative_norms: [0.05, 0.1, 0.2]
  layer_fractions: [0.25, 0.4, 0.55, 0.7]
  bootstrap_samples: 1000
  parse_failure_limit: 0.1
statistics:
  bootstrap_samples: 1000
  confidence: 0.95
  correction: holm
sae:
  enabled: true
  reconstruction_cosine_min: 0.8
  fve_min: 0.5
  max_dead_feature_fraction: 0.95
  max_lm_loss_delta: 0.1
  max_next_token_kl: 0.1
  matched_random_draws: 5
decisions:
  practical_f1: 0.02
  latent_gap: 0.05
  elicitation_fraction: 0.5
  equivalence_margin: 0.02
  strong_cross_recovery: 0.5
  cross_recovery_ci_floor: 0.3
resources:
  launcher: local
  devices: []
  pools:
    hf_single:
      gpus_per_job: 1
      tensor_parallel_size: 1
      exclusive: true
    reflector:
      gpus_per_job: 1
      tensor_parallel_size: 1
      exclusive: true
    cpu_probe:
      gpus_per_job: 0
      max_workers: 32
  scratch_root: results
output:
  root: results
  timezone: UTC
  activation_compressor: zstd
