[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-prompt-interpretability"
version = "0.1.0"
description = "Reproducible experiments for continuous prompt adaptation and residual analysis"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "huggingface-hub>=0.24",
  "joblib>=1.4",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "peft>=0.14,<1",
  "pyarrow>=16",
  "safetensors>=0.4",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "seaborn>=0.13",
  "torch>=2.2",
  "transformers>=4.46,<6"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
